<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--bg:#000;--bg2:#1C1C1E;--bg3:#2C2C2E;--tx:#fff;--tx2:rgba(235,235,245,.62);--tx3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--hl:rgba(255,255,255,.07);

body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 18px}

.hero .ing{display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:600;line-height:1.35}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;animation:fade .35s var(--spring)}

.grab{width:38px;height:5px;border-radius:3px;background:var(--tx3);margin:7px auto 0}

.donutwrap{display:grid;place-items:center;padding:10px 0 16px;position:relative}

#edd{touch-action:none;display:block;position:relative}
.dcenter{position:absolute;text-align:center;pointer-events:none}.dcenter b{font:600 30px var(--disp);display:block;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.dcenter span{font-size:13px;color:var(--tx2)}

.val{min-width:64px;text-align:right;font:600 15px var(--disp);font-variant-numeric:tabular-nums;flex:none}
.val small{display:block;font:400 12px -apple-system,system-ui,sans-serif;color:var(--tx2)}
.seg{position:relative;display:flex;background:var(--fill);border-radius:12px;padding:3px}.seg button{flex:1;min-height:34px;border-radius:9px;font-size:13px;font-weight:500;transition:background .3s var(--spring),box-shadow .3s}
.seg .on{background:var(--bg2);box-shadow:0 2px 8px rgba(0,0,0,.18);font-weight:600}html[data-theme=dark] .seg .on{background:#5A5A5E}
.field{width:100%;border:0;border-radius:16px;background:var(--bg2);padding:14px 16px;outline:0;resize:none}
.x{width:30px;height:30px;border-radius:15px;background:var(--fill);color:var(--tx2);flex:none;font-size:16px;line-height:1}
.pbar{display:flex;align-items:center;gap:12px;padding:11px 16px}.pbar .l{width:104px;font-size:15px;flex:none}.pbar .bar{flex:1;height:10px;border-radius:5px;margin:0}.pbar .bar i{border-radius:5px}
.stat{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:4px}.stat div{background:var(--bg2);border-radius:22px;padding:16px;min-width:0}.stat div:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between}
.stat b{font:600 26px/1.1 var(--disp);display:block;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat div:first-child b{font-size:44px}.stat span{font-size:13px;color:var(--tx2);display:block;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translate(-50%,16px) scale(.96);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px var(--glassln),0 10px 30px -10px rgba(0,0,0,.5);padding:11px 18px;border-radius:22px;font-size:15px;font-weight:500;opacity:0;transition:.45s var(--spring);pointer-events:none;z-index:20;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.na{animation:none!important}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

/* сумісність категорій */
const M={};{const o='CBTFDKRXO',r=['5 9 9 75 45 75 8 9 3','9 6 65 8 85 8 7 8 4','9 65 6 7 6 7 65 85 3','75 8 7 55 7 75 7 85 4','45 85 6 7 5 6 55 5 7','75 8 7 75 6 55 65 85 3','8 7 65 7 55 65 4 75 5','9 8 85 85 5 85 75 2 2','3 4 3 4 7 3 5 2 3'];

  let h=`<header class="nav"><h1>Що забити?</h1><button class="navbtn" data-a="new" aria-label="Нова забивка">${PLUS}</button></header>`;
  if(pend)h+=`<div class="banner"><div style="font-weight:600">Як тобі остання забивка?</div><div class="sub">${esc(pend[0].items.map(i=>tob(i[0]).n).join(' + '))}</div>${stars(0,'rate',pend[1])}</div>`;
  const avail=S.shelf.filter(s=>left(s)>0).length;
  if(avail<2)return h+`<div class="empty"><div class="ring"></div><div class="big">${avail?'Потрібно ще хоча б один':'Полиця порожня'}</div><p>Додай тютюн, який у тебе є, і тут з'являться мікси.</p><button class="btn" data-a="catalog">Додати тютюн</button></div>`;
  h+=`<div class="chips">${MODES.map(m=>`<button class="chip ${m[0]===mode?'on':''}" data-a="mode" data-x="${m[0]}">${m[1]}</button>`).join('')}</div>`;
  const r=suggest(mode);window._sug=r;
  if(!r.length)return h+`<div class="empty"><div class="ring"></div><div class="big">Нічого не знайшлося</div><p>${mode==='new'?'Усі вдалі поєднання з полиці ти вже пробував.':mode==='low'?'На полиці немає тютюну, що закінчується.':'З того, що є на полиці, такий мікс не зібрати.'}</p></div>`;
  const it=m=>m.ids.map((id,j)=>[id,m.p[j]]);
  h+=heroCard(it(r[0]),`<div class="why">${r[0].why.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`,'use',0,'Найкраще з твоєї полиці','Забити');
  if(r.length>1)h+=`<h3>Ще варіанти</h3><div class="list">${r.slice(1).map((m,i)=>mixRow(it(m),esc(m.why[0]),'use',i+1)).join('')}</div>`;
  if(!S.log.some(e=>e.r)&&!S.likes.length)h+=`<p class="foot">Поки що це загальні правила поєднання смаків. Оціни кілька забивок або познач улюблені смаки у вкладці «Смак», і підбір стане особистим.</p>`;
  return h}
function vShelf(){let h=`<header class="nav"><h1>Полиця</h1><button class="navbtn" data-a="catalog" aria-label="Додати тютюн">${PLUS}</button></header>`;
  if(!S.shelf.length)return h+`<div class="empty"><div class="ring"></div><div class="big">Тут поки порожньо</div><p>Познач у каталозі все, що лежить удома.</p><button class="btn" data-a="catalog">Відкрити каталог</button></div>`;
  const g={};S.shelf.forEach(s=>{const t=tob(s.id);(g[t.b||'Інше']=g[t.b||'Інше']||[]).push([s,t])});
  for(const b of Object.keys(g).sort())h+=`<h3>${esc(b)}</h3><div class="list">${g[b].sort((a,c)=>a[1].n.localeCompare(c[1].n)).map(([s,t])=>{const l=left(s),c=t.notes.length?N[t.notes[0]].col:'#8E8E93';
    return`<button class="li" data-a="item" data-x="${esc(s.id)}"><i class="dot" style="background:${c}"></i><div class="t"><div>${esc(t.n)}</div><div class="sub">${esc(tdesc(t))}</div><div class="bar"><i style="width:${l/s.pack*100}%;background:${isLow(s)?'var(--bad)':c}"></i></div></div>${meter(tstr(t))}<span class="tr">≈ ${Math.round(l)} г</span><span class="chev">›</span></button>`}).join('')}</div>`;
  return h+`<p class="foot">Залишок рахується приблизно: від пачки віднімається кожна записана забивка. Якщо розбіжність велика, поправ вручну в картці тютюну.</p>`}
function vLog(){let h=`<header class="nav"><h1>Щоденник</h1><button class="navbtn" data-a="new" aria-label="Нова забивка">${PLUS}</button></header>`;
  if(!S.log.length)return h+`<div class="empty"><div class="ring"></div><div class="big">Ще жодної забивки</div><p>Записуй, що забив, і оцінюй. З цього вчиться підбір.</p><button class="btn" data-a="new">Записати забивку</button></div>`;
  const best=S.log.map((e,i)=>[e,i]).filter(x=>x[0].r>=4).sort((a,b)=>b[0].r-a[0].r||b[0].t-a[0].t)[0];
  if(best)h+=heroCard(best[0].items,`<div class="why" style="align-items:center">${starsS(best[0].r)}${best[0].bowl?`<span>${esc(best[0].bowl)}, ${best[0].coals} вугілля</span>`:''}</div>`,'entry',best[1],'Твій найкращий мікс','');
  const mo={};S.log.map((e,i)=>[e,i]).reverse().forEach(x=>{const k=x[0].mem?'З пам’яті':new Date(x[0].t).toLocaleDateString('uk-UA',new Date(x[0].t).getFullYear()===new Date().getFullYear()?{month:'long'}:{month:'long',year:'numeric'});(mo[k]=mo[k]||[]).push(x)});
  for(const k in mo)h+=`<h3>${k[0].toUpperCase()+k.slice(1)}</h3><div class="list">${mo[k].map(([e,i])=>mixRow(e.items,(e.mem?'':new Date(e.t).toLocaleDateString('uk-UA',{day:'numeric',month:'short'})+', ')+esc(e.bowl||''),'entry',i,e.r?starsS(e.r):'<span class="chip sm" style="background:var(--fill);color:var(--ember);font-weight:600">Оцінити</span>')).join('')}</div>`;
  return h}
function vTaste(){const P=prefs(),rated=S.log.filter(e=>e.r);
  let h=`<header class="nav"><h1>Смак</h1></header>`;
  const tp=Object.entries(P.t).sort((a,b)=>b[1]-a[1])[0];
  h+=`<div class="stat"><div><span>Забивок</span><b>${S.log.length}</b></div><div><b>${rated.length?(rated.reduce((s,e)=>s+e.r,0)/rated.length).toFixed(1):'—'}</b><span>середня оцінка</span></div><div><b style="font-size:15px;line-height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tp&&tp[1]>0?esc(tob(tp[0]).n):'—'}</b><span>фаворит</span></div></div>`;
  const pl=Object.entries(P.n).filter(x=>N[x[0]]).sort((a,b)=>b[1]-a[1]),top=pl.filter(x=>x[1]>.05).slice(0,6),bad=pl.filter(x=>x[1]<-.15).slice(-3).reverse();
  if(top.length)h+=`<h3>Що тобі заходить</h3><div class="list">${top.map(([k,v])=>`<div class="pbar"><span class="l">${N[k].l}</span><div class="bar"><i style="width:${Math.min(100,v*100)}%;background:${N[k].col}"></i></div></div>`).join('')}</div>`;
  if(bad.length)h+=`<h3>Не твоє</h3><div class="list"><div class="pbar" style="flex-wrap:wrap">${bad.map(([k])=>`<span class="chip sm"><i class="dot" style="background:${N[k].col}"></i>${N[k].l}</span>`).join('')}</div></div>`;
  h+=`<h3>Улюблені смаки</h3><div class="chips wrap">${'mango lime lemon mint ice strawberry raspberry blueberry bcurrant cherry grapefruit orange peach watermelon melon grape apple pineapple passion kiwi banana cola icecream candy tea'.split(' ').map(k=>`<button class="chip sm ${S.likes.includes(k)?'on':''}" data-a="like" data-x="${k}"><i class="dot" style="background:${N[k].col}"></i>${N[k].l}</button>`).join('')}</div><p class="foot" style="margin-left:0">Познач, що любиш. Це стартова підказка для підбору, далі він вчиться на оцінках.</p>`;
  const bl=buyList();
  h+=`<h3>Що докупити</h3><button class="li" data-a="check" style="background:var(--bg2);border-radius:22px;margin-bottom:10px"><span class="navbtn" style="width:36px;height:36px">${ic('M11 4a7 7 0 100 14 7 7 0 000-14z|M20 20l-4-4')}</span><div class="t w"><div style="font-weight:600">Перевірити будь-який тютюн</div><div class="sub">Чи смачно буде і з чим змішати</div></div><span class="chev">›</span></button><div class="list">${bl.map(x=>`<div class="li" data-a="check" data-x="${esc(x.t.id)}" role="button" tabindex="0"><i class="dot" style="background:${N[x.t.notes[0]].col}"></i><div class="t"><div>${esc(tname(x.t))}</div><div class="sub">${esc(tdesc(x.t))}</div><div class="sub" style="color:var(--tint)">${esc(x.why)}</div></div><button class="chip sm" data-a="bought" data-x="${esc(x.t.id)}">Купив</button></div>`).join('')}</div>`;
  h+=`<h3>Налаштування</h3><div class="list"><div class="li"><div class="t"><div>Вага забивки</div><div class="sub">Якщо не зважуєш, для залишків береться вона</div></div><span class="tr">${S.set.g} г</span><div class="step"><button data-a="setg" data-x="-1" aria-label="Менше">−</button><button data-a="setg" data-x="1" aria-label="Більше">+</button></div></div>
  <button class="li" data-a="backup"><div class="t"><div>Резервна копія</div><div class="sub">Експорт та імпорт даних</div></div><span class="chev">›</span></button></div>
  <p class="foot">Каталог: ${CAT.length} смаків від ${Object.keys(BR).length} виробників з українських магазинів, жовтень 2026. Міцність вказана за лінійкою, її можна поправити в картці тютюну. Чого немає, додай вручну в каталозі. 18+</p>`;
  return h}

/* ---------- Шторки ---------- */
function open(type,d){fresh=!sheet;sheet={type,d:d||{}};q='';brandF='';renderSheet();try{tgOK&&TG.BackButton.show()}catch(e){}}
function close(){sheet=null;$('#sheet').innerHTML='';try{tgOK&&TG.BackButton.hide()}catch(e){}render()}
function shell(title,body,right){return`<div class="backdrop" data-a="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="shead"><button data-a="close">${right?'Скасувати':'Закрити'}</button><h2>${esc(title)}</h2>${right?`<button class="b" data-a="${right[1]}">${right[0]}</button>`:'<span style="width:60px"></span>'}</div><div class="sbody">${body}</div></section>`}
function renderSheet(keep){if(!sheet)return;const sb=$('.sbody'),st=keep&&sb?sb.scrollTop:0;
  $('#sheet').innerHTML={check:sCheck,catalog:sCatalog,custom:sCustom,item:sItem,editor:sEditor,entry:sEntry,backup:sBackup}[sheet.type]();
  if(!fresh)document.querySelectorAll('.sheet,.backdrop').forEach(e=>e.classList.add('na'));fresh=false;if(st)$('.sbody').scrollTop=st;if(sheet.type==='editor')bindDonut()}
function catRows(){const have=new Set(S.shelf.map(s=>s.id)),qq=q.trim().toLowerCase();
  const all=CAT.concat(S.custom).filter(t=>(!brandF||(brandF==='*'?t.id[0]==='x':t.b===brandF))&&(!qq||(tname(t)+' '+tdesc(t)).toLowerCase().includes(qq)));
  if(!all.length)return`<div class="empty"><p>Нічого не знайдено. Додай свій тютюн кнопкою нижче.</p></div>`;
  return`<div class="list">${all.map(t=>`<button class="li" data-a="toggle" data-x="${esc(t.id)}"><i class="dot" style="background:${t.notes.length?N[t.notes[0]].col:'#8E8E93'}"></i><div class="t"><div>${esc(t.n)}</div><div class="sub">${esc(t.b+(t.ln?' '+t.ln:''))} · ${esc(tdesc(t))}</div></div>${meter(tstr(t))}<span class="check ${have.has(t.id)?'on':''}"></span></button>`).join('')}</div>`}
function sCatalog(){const bs=[['','Усі']].concat(Object.values(BR).map(b=>[b,b]),S.custom.length?[['*','Свої']]:[]);
  return shell('Каталог',`<input class="search" type="search" placeholder="Пошук: назва або смак" value="${esc(q)}" data-i="q" aria-label="Пошук"><div class="chips">${bs.map(b=>`<button class="chip ${b[0]===brandF?'on':''}" data-a="brand" data-x="${b[0]}">${b[1]}</button>`).join('')}</div><div id="catrows">${catRows()}</div><button class="btn gray" data-a="custom">Додати свій тютюн</button>`)}
function sCustom(){const d=sheet.d;d.notes=d.notes||[];
  return shell('Свій тютюн',`<h3>Назва</h3><input class="field" placeholder="Бренд" value="${esc(d.b||'')}" data-i="cb" style="margin-bottom:8px"><input class="field" placeholder="Смак, як на пачці" value="${esc(d.n||'')}" data-i="cn">
  <h3>Міцність</h3><div class="seg">${[1,2,3].map(v=>`<button class="${(d.s||2)===v?'on':''}" data-a="cstr" data-x="${v}">${STL[v]}</button>`).join('')}</div>
  <h3>Що у смаку (до 4, головний першим)</h3>${Object.keys(CATL).map(c=>`<div class="sub" style="margin:10px 0 6px">${CATL[c]}</div><div class="chips wrap">${Object.values(N).filter(n=>n.c===c).map(n=>`<button class="chip sm ${d.notes.includes(n.k)?'on':''}" data-a="cnote" data-x="${n.k}"><i class="dot" style="background:${n.col}"></i>${n.l}${d.notes.includes(n.k)?' · '+(d.notes.indexOf(n.k)+1):''}</button>`).join('')}</div>`).join('')}`,['Додати','csave'])}
function sItem(){const s=S.shelf.find(x=>x.id===sheet.d.id);if(!s)return'';const t=tob(s.id),l=left(s),c=t.notes.length?N[t.notes[0]].col:'#8E8E93';
  const us=S.log.filter(e=>e.items.some(i=>i[0]===s.id)),rt=us.filter(e=>e.r);
  return shell(t.n,`<div class="sub" style="text-align:center;margin-bottom:10px">${esc(t.b+(t.ln?' '+t.ln:''))}</div><div class="chips wrap" style="justify-content:center">${t.notes.map(k=>`<span class="chip sm"><i class="dot" style="background:${N[k].col}"></i>${N[k].l}</span>`).join('')}</div>
  <h3>Міцність</h3><div class="seg">${[1,2,3].map(v=>`<button class="${tstr(t)===v?'on':''}" data-a="str" data-x="${v}">${STL[v]}</button>`).join('')}</div>
  <h3>Залишок</h3><div class="list"><div class="li"><div class="t"><div>≈ ${Math.round(l)} г із ${s.pack}</div><div class="bar"><i style="width:${l/s.pack*100}%;background:${isLow(s)?'var(--bad)':c}"></i></div></div><div class="step"><button data-a="left" data-x="-10" aria-label="Менше на 10 грамів">−</button><button data-a="left" data-x="10" aria-label="Більше на 10 грамів">+</button></div></div></div>
  ${(()=>{const ms=suggest('me',{must:s.id,n:3});return ms.length?`<h3>Найкращі мікси з ним</h3><div class="list">${ms.map((m,i)=>mixRow(m.ids.map((x,j)=>[x,m.p[j]]),esc(m.p.map(x=>x+'%').join(' / ')+', '+m.why[0].toLowerCase()),'itmix',i)).join('')}</div>`:''})()}
  <h3>Нова пачка</h3><div class="chips wrap">${[40,50,100,200,250].map(g=>`<button class="chip" data-a="pack" data-x="${g}">${g} г</button>`).join('')}</div>
  <h3>Історія</h3><div class="list"><div class="li"><div class="t">Забивок із ним</div><span class="tr">${us.length}</span></div><div class="li"><div class="t">Середня оцінка міксів</div><span class="tr">${rt.length?'★ '+(rt.reduce((a,e)=>a+e.r,0)/rt.length).toFixed(1):'—'}</span></div></div>
  <button class="btn red" data-a="remove">Закінчився, прибрати з полиці</button>`)}
const BOWLS=['Фанел','Турка','Убивашка','Вортекс','Інша'],HEAT=['Калауд','Фольга'],COALS=[2,3,4],PK=['Пухка','Середня','Щільна'];
function newEd(items){const l=S.set.last||{};return{items:items||[],G:0,bowl:l.bowl||'Фанел',heat:l.heat||'Калауд',coals:l.coals||3,pk:l.pk||'Пухка',r:0,note:''}}
const cums=()=>{let c=0;return sheet.d.items.map(i=>c+=i.p)};
function edDonut(){const E=sheet.d,sz=240,sw=46,r=(sz-sw)/2,C=2*Math.PI*r,cl=cols(E.items.map(i=>i.id));let off=0,h='';
  if(!E.items.length)return`<circle cx="120" cy="120" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${sw}"/>`;
  h+=`<g transform="rotate(-90 120 120)">`+E.items.map((it,i)=>{const len=C*it.p/100,vis=Math.max(0,len-(E.items.length>1?2.5:0));const s=`<circle cx="120" cy="120" r="${r}" fill="none" stroke="${cl[i]}" stroke-width="${sw}" stroke-dasharray="${vis} ${C-vis}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('')+'</g>';
  cums().slice(0,-1).forEach(c=>{const a=c/100*2*Math.PI-Math.PI/2,x=120+r*Math.cos(a),y=120+r*Math.sin(a);h+=`<circle cx="${x}" cy="${y}" r="14" fill="#fff" stroke="rgba(0,0,0,.18)"/><circle cx="${x}" cy="${y}" r="4" fill="#1C1C1E"/>`});return h}
function edRows(){const E=sheet.d,cl=cols(E.items.map(i=>i.id));
  return E.items.map((it,i)=>{const t=tob(it.id);return`<div class="li"><i class="dot" style="background:${cl[i]}"></i><div class="t"><div>${esc(t.n)}</div><div class="sub">${esc(t.b)}</div></div><span class="val">${E.G?(Math.round(it.p*E.G/50)/2)+' г':Math.round(it.p)+'%'}${E.G?`<small>${Math.round(it.p)}%</small>`:''}</span><div class="step"><button data-a="adj" data-x="${i}" data-d="-1" aria-label="Менше">−</button><button data-a="adj" data-x="${i}" data-d="1" aria-label="Більше">+</button></div><button class="x" data-a="del" data-x="${i}" aria-label="Прибрати">×</button></div>`}).join('')}
function eqRows(){const E=sheet.d,qq=(E.q||'').trim().toLowerCase();if(!qq)return'';const inMix=new Set(E.items.map(i=>i.id));
  const r=CAT.concat(S.custom).filter(t=>!inMix.has(t.id)&&(tname(t)+' '+tdesc(t)).toLowerCase().includes(qq)).slice(0,8);
  if(!r.length)return'<p class="foot">Не знайдено. Додай свій тютюн у каталозі на вкладці «Полиця».</p>';
  return`<div class="list">${r.map(t=>`<button class="li" data-a="add" data-x="${esc(t.id)}"><i class="dot" style="background:${N[t.notes[0]].col}"></i><div class="t"><div>${esc(tname(t))}</div><div class="sub">${esc(tdesc(t))}</div></div>${meter(tstr(t))}</button>`).join('')}</div>`}
function edRec(){const E=sheet.d;if(!E.items.length)return'';const r=rec(E.items.map(i=>[i.id,i.p]));const same=E.bowl===r.bowl&&E.coals===r.coals&&E.pk===r.pk;
  return`<h3>Порада: чаша і жар</h3><div class="list"><div class="li"><div class="t w"><div style="font-weight:600">${r.bowl} · ${r.coals} вугілля · ${r.pk.toLowerCase()} забивка</div><div class="sub">Мікс ${['','легкий','середньої міцності','міцний'][r.s]}. ${r.why}</div>${r.mine?`<div class="sub" style="color:var(--tint)">У тебе добре заходило: ${esc(r.mine)}</div>`:''}</div>${same?'':'<button class="chip sm" data-a="recuse">Застосувати</button>'}</div></div><p class="foot">Розрахунок на вугілля 25 мм. Це загальне правило, орієнтуйся на свій кальян.</p>`}
function sEditor(){const E=sheet.d,inMix=new Set(E.items.map(i=>i.id)),rest=S.shelf.filter(s=>!inMix.has(s.id)&&left(s)>0).map(s=>tob(s.id));
  const seg=(k,arr)=>`<div class="seg">${arr.map(v=>`<button class="${E[k]===v?'on':''}" data-a="opt" data-k="${k}" data-x="${v}">${v}</button>`).join('')}</div>`;

  ${E.items.length<4&&rest.length?`<h3>Додати з полиці</h3><div class="chips wrap">${rest.map(t=>`<button class="chip sm" data-a="add" data-x="${esc(t.id)}"><i class="dot" style="background:${N[t.notes[0]]?N[t.notes[0]].col:'#8E8E93'}"></i>${esc(t.n)}</button>`).join('')}</div>`:''}
  ${E.items.length<4?`<h3>Немає на полиці? Знайди в каталозі</h3><input class="search" type="search" placeholder="Назва або смак" value="${esc(E.q||'')}" data-i="eq" aria-label="Пошук у каталозі" style="margin-bottom:8px"><div id="eqrows">${eqRows()}</div>`:''}
  <div class="list" style="margin-top:14px"><button class="li" data-a="mem"><div class="t w"><div>З пам’яті</div><div class="sub">Курив раніше: оцінка піде у смак, з полиці нічого не спишеться</div></div><span class="check ${E.mem?'on':''}"></span></button></div>
  <div id="edrec">${edRec()}</div>
  <h3>Вага</h3><div class="list"><div class="li"><div class="t"><div>${E.G?'Зважив':'Без ваг'}</div><div class="sub">${E.G?'Кнопки − і + міняють грами':'Частки у відсотках, на око'}</div></div>${E.G?`<span class="tr">${E.G} г</span><div class="step"><button data-a="G" data-x="-1" aria-label="Менше">−</button><button data-a="G" data-x="1" aria-label="Більше">+</button></div>`:''}<button class="chip sm" data-a="Gt">${E.G?'Вимкнути':'Є ваги'}</button></div></div>
  <h3>Чаша</h3>${seg('bowl',BOWLS)}<h3>Жар</h3>${seg('heat',HEAT)}<h3>Вугілля, шт</h3>${seg('coals',COALS)}<h3>Щільність</h3>${seg('pk',PK)}
  <h3>Оцінка (можна пізніше)</h3><div class="list" style="padding:2px 8px">${stars(E.r,'er')}</div>
  <h3>Нотатка</h3><textarea class="field" rows="2" placeholder="Напр.: на 3 вугіллях гірчить" data-i="note">${esc(E.note)}</textarea>
  <button class="btn" data-a="esave" ${E.items.length?'':'disabled'}>Зберегти забивку</button>`)}
function sEntry(){const i=sheet.d.i,e=S.log[i];if(!e)return'';
  return shell('Забивка',`${heroCard(e.items,'','noop','',e.mem?'З пам’яті':fmtD(e.t),'')}
  <div class="list" style="padding:2px 8px">${stars(e.r||0,'rate',i)}</div>
  <h3>Деталі</h3><div class="list"><div class="li"><div class="t">Коли</div><span class="tr">${fmtD(e.t)}</span></div>${e.g?`<div class="li"><div class="t">Вага</div><span class="tr">${e.g} г</span></div>`:''}<div class="li"><div class="t">Чаша</div><span class="tr">${esc(e.bowl||'—')}</span></div><div class="li"><div class="t">Жар</div><span class="tr">${esc(e.heat||'—')}, ${e.coals||'—'} вугілля</span></div><div class="li"><div class="t">Щільність</div><span class="tr">${esc(e.pk||'—')}</span></div></div>
  <h3>Нотатка</h3><textarea class="field" rows="2" placeholder="Що запам'ятати про цей мікс" data-i="enote">${esc(e.note||'')}</textarea>
  <button class="btn" data-a="repeat">Повторити</button><button class="btn gray" data-a="share">Поділитися міксом</button><button class="btn red" data-a="edel">Видалити</button>`)}
function chkRows(){const qq=(sheet.d.q||'').trim().toLowerCase();if(!qq)return'';const have=new Set(S.shelf.map(s=>s.id));
  const r=CAT.concat(S.custom).filter(t=>!have.has(t.id)&&(tname(t)+' '+tdesc(t)).toLowerCase().includes(qq)).slice(0,12);
  if(!r.length)return'<p class="foot">Не знайдено. Спробуй назву смаку, наприклад «манго».</p>';
  return`<div class="list">${r.map(t=>`<button class="li" data-a="chk" data-x="${esc(t.id)}"><i class="dot" style="background:${N[t.notes[0]].col}"></i><div class="t"><div>${esc(tname(t))}</div><div class="sub">${esc(tdesc(t))}</div></div>${meter(tstr(t))}<span class="chev">›</span></button>`).join('')}</div>`}
function sCheck(){const d=sheet.d;
  if(!d.id)return shell('Перевірити тютюн',`<p class="sub" style="margin:4px 4px 14px">Знайди тютюн, який хочеш купити. Покажу, чи він тобі смакуватиме і з чим із твоєї полиці його змішати.</p><input class="search" type="search" placeholder="Бренд, назва або смак" value="${esc(d.q||'')}" data-i="chq" aria-label="Пошук тютюну"><div id="chkrows">${chkRows()}</div>`);
  const v=verdict(d.id),t=v.t,col=N[t.notes[0]].col,inShelf=S.shelf.some(s=>s.id===t.id);
  return shell(t.n,`<div class="hero"><div class="core"><div class="lbl">${esc(t.b+(t.ln?' '+t.ln:''))} · ${STL[tstr(t)]}</div>
    <div class="top"><span class="bowl"><span class="halo" style="background:conic-gradient(${col} 0 ${v.fit}%,transparent 0)"></span><span class="spin"><svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="46" fill="none" stroke="var(--fill)" stroke-width="16"/><circle cx="56" cy="56" r="46" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${2.89*v.fit} 289" transform="rotate(-90 56 56)"/></svg></span><span class="dcenter"><b style="font-size:24px">${v.fit}%</b></span></span>
    <div class="names"><div style="font:600 20px/1.2 var(--disp)">${v.lbl}</div><div class="sub">${esc(tdesc(t))}</div></div></div>
    <div class="why">${v.why.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div></div>
    ${v.mixes.length?`<h3>З твоєю полицею</h3><div class="list">${v.mixes.map((m,i)=>mixRow(m.ids.map((x,j)=>[x,m.p[j]]),esc(m.p.map(x=>x+'%').join(' / ')+', '+m.why[0].toLowerCase()),'chkmix',i)).join('')}</div><p class="foot">Натисни мікс, щоб одразу записати забивку з ним.</p>`:''}
    ${inShelf?'':'<button class="btn" data-a="chkbuy">Купив, додати на полицю</button>'}<button class="btn gray" data-a="chkback">Перевірити інший</button>`)}
function sBackup(){return shell('Резервна копія',`<h3>Твої дані</h3><textarea class="field" rows="6" id="bk" style="font-size:13px">${esc(JSON.stringify(S))}</textarea><button class="btn gray" data-a="bcopy">Скопіювати</button><button class="btn" data-a="bimp">Імпортувати з поля</button><p class="foot">У Telegram дані синхронізуються між твоїми пристроями автоматично. Копія потрібна, щоб перенести їх в іншого бота або акаунт.</p><button class="btn red" data-a="reset">Стерти все</button>`)}

/* ---------- Редактор чаші ---------- */
function edFix(){const E=sheet.d;if(!E.items.length)return;const s=E.items.reduce((a,i)=>a+i.p,0);if(Math.abs(s-100)>.01){const b=E.items.reduce((a,i)=>i.p>a.p?i:a);b.p+=100-s}}
function edAdd(id){const E=sheet.d,n=E.items.length;if(n>=4)return;if(!n){E.items.push({id,p:100});return}
  const np=Math.max(5,Math.round(100/(n+1)/5)*5);let need=np;while(need>0){const b=E.items.reduce((a,i)=>i.p>a.p?i:a);const d=Math.min(5,need,b.p-5);if(d<=0)break;b.p-=d;need-=d}
  E.items.push({id,p:np-need});edFix()}
function edAdj(i,d){const E=sheet.d,it=E.items[i];if(E.items.length<2)return;
  if(E.G){const g=it.p*E.G/100+d;if(g<1)return;const gs=E.items.map(x=>x.p*E.G/100);gs[i]=g;E.G=Math.round((E.G+d)*2)/2;E.items.forEach((x,j)=>x.p=gs[j]/E.G*100);return}
  const st=5*d,o=E.items.filter((x,j)=>j!==i).sort((a,b)=>d>0?b.p-a.p:a.p-b.p)[0];
  if(it.p+st<5||o.p-st<5)return;it.p+=st;o.p-=st}
function edHalo(){const b=$('.donutwrap .bowl');if(b)b.innerHTML=sheet.d.items.length?halo(sheet.d.items.map(i=>[i.id,i.p])):''}
function bindDonut(){const el=$('#edd');if(!el)return;let act=-1;
  const pos=e=>{const b=el.getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2;let a=Math.atan2(y,x)+Math.PI/2;if(a<0)a+=2*Math.PI;return{f:a/(2*Math.PI)*100,r:Math.hypot(x,y)*240/b.width}};
  el.onpointerdown=e=>{const E=sheet.d;if(E.items.length<2)return;const p=pos(e);if(p.r<50||p.r>135)return;let best=-1,bd=8;cums().slice(0,-1).forEach((c,i)=>{let d=Math.abs(c-p.f);d=Math.min(d,100-d);if(d<bd){bd=d;best=i}});
    if(best>=0){act=best;try{el.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()}};
  el.onpointermove=e=>{if(act<0)return;const E=sheet.d,c=cums(),cur=c[act],lo=(act?c[act-1]:0),hi=c[act+1];let v=pos(e).f;
    if(Math.abs(v+100-cur)<Math.abs(v-cur))v+=100;else if(Math.abs(v-100-cur)<Math.abs(v-cur))v-=100;
    const st=E.G?100/(E.G*2):5,mn=E.G?st*2:5;v=clamp(Math.round(v/st)*st,lo+mn,hi-mn);if(Math.abs(v-cur)<.001)return;
    E.items[act].p=v-lo;E.items[act+1].p=hi-v;el.innerHTML=edDonut();edHalo();$('#edrows').innerHTML=edRows();hap()};
  el.onpointerup=el.onpointercancel=()=>{if(act>=0)$('#edrec').innerHTML=edRec();act=-1}}

/* ---------- Дії ---------- */
const A={
  tab(d){tab=d.x;render();window.scrollTo(0,0);hap()},
  mode(d){mode=d.x;render();hap()},
  close(){close()},noop(){},
  new(){open('editor',newEd())},
  use(d){const m=window._sug[+d.x];open('editor',newEd(m.ids.map((id,i)=>({id,p:m.p[i]}))))},
  catalog(){open('catalog')},
  brand(d){brandF=d.x;renderSheet()},
  toggle(d){const i=S.shelf.findIndex(s=>s.id===d.x);if(i>=0)S.shelf.splice(i,1);else S.shelf.push({id:d.x,pack:100,used:0});save();hap();$('#catrows').innerHTML=catRows()},
  custom(){open('custom',{notes:[]})},
  cnote(d){const n=sheet.d.notes,i=n.indexOf(d.x);if(i>=0)n.splice(i,1);else if(n.length<4)n.push(d.x);renderSheet(1)},
  csave(){const d=sheet.d;if(!(d.n||'').trim()||!d.notes.length)return toast('Вкажи назву і хоча б один смак');
    const t={id:'x:'+Date.now().toString(36),b:(d.b||'').trim(),n:d.n.trim(),d:'',notes:d.notes,ln:'',s:d.s||2};S.custom.push(t);S.shelf.push({id:t.id,pack:100,used:0});save();hap('ok');toast('Додано на полицю');close()},
  item(d){open('item',{id:d.x})},
  str(d){const s=S.shelf.find(x=>x.id===sheet.d.id);s.s=+d.x;save();hap();renderSheet(1)},
  cstr(d){sheet.d.s=+d.x;renderSheet(1)},
  mem(){sheet.d.mem=!sheet.d.mem;hap();renderSheet(1)},
  recuse(){const E=sheet.d,r=rec(E.items.map(i=>[i.id,i.p]));E.bowl=r.bowl;E.coals=r.coals;E.pk=r.pk;hap('ok');renderSheet(1)},
  left(d){const s=S.shelf.find(x=>x.id===sheet.d.id);s.used=clamp(s.used-(+d.x),0,s.pack);save();renderSheet(1)},
  pack(d){const s=S.shelf.find(x=>x.id===sheet.d.id);s.pack=+d.x;s.used=0;save();hap('ok');renderSheet(1)},
  remove(){S.shelf=S.shelf.filter(x=>x.id!==sheet.d.id);save();close()},
  bought(d){S.shelf.push({id:d.x,pack:100,used:0});save();hap('ok');toast('Додано на полицю');render()},
  like(d){const i=S.likes.indexOf(d.x);if(i>=0)S.likes.splice(i,1);else S.likes.push(d.x);save();hap();const y=window.scrollY;render();window.scrollTo(0,y)},
  setg(d){S.set.g=clamp(S.set.g+(+d.x),8,40);save();const y=window.scrollY;render();window.scrollTo(0,y)},
  rate(d){const e=S.log[+d.x];if(!e)return;e.r=+d.r;save();hap('ok');toast('Оцінку збережено');if(sheet)renderSheet(1);else render()},
  entry(d){open('entry',{i:+d.x})},
  add(d){edAdd(d.x);sheet.d.q='';hap();renderSheet(1)},
  del(d){const E=sheet.d,p=E.items[+d.x].p;E.items.splice(+d.x,1);if(E.items.length){const b=E.items.reduce((a,i)=>i.p>a.p?i:a);b.p+=p}renderSheet(1)},
  adj(d){edAdj(+d.x,+d.d);hap();$('#edd').innerHTML=edDonut();edHalo();$('#edrows').innerHTML=edRows();const c=$('#edc b');if(sheet.d.G)c.textContent=sheet.d.G+' г';$('#edrec').innerHTML=edRec()},
  G(d){const E=sheet.d;E.G=clamp(E.G+(+d.x),5,45);renderSheet(1)},
  Gt(){const E=sheet.d;E.G=E.G?0:S.set.g;if(!E.G)E.items.forEach(i=>i.p=Math.round(i.p)),edFix();renderSheet(1)},
  opt(d){sheet.d[d.k]=d.k==='coals'?+d.x:d.x;hap();renderSheet(1)},
  er(d){sheet.d.r=sheet.d.r===+d.r?0:+d.r;hap();renderSheet(1)},
  esave(){const E=sheet.d;if(!E.items.length)return;const ps=E.items.map(i=>Math.round(i.p));ps[ps.indexOf(Math.max(...ps))]+=100-ps.reduce((a,b)=>a+b,0);
    const g=E.G||S.set.g;if(!E.mem)E.items.forEach((it,i)=>{const s=S.shelf.find(x=>x.id===it.id);if(s)s.used=Math.min(s.pack,s.used+g*ps[i]/100)});
    S.log.push({t:Date.now(),items:E.items.map((it,i)=>[it.id,ps[i]]),g:E.G||0,bowl:E.bowl,heat:E.heat,coals:E.coals,pk:E.pk,r:E.r,note:E.note.trim(),mem:E.mem?1:0});
    S.set.last={bowl:E.bowl,heat:E.heat,coals:E.coals,pk:E.pk};save();hap('ok');tab='log';close();toast(E.r?'Забивку збережено':'Збережено. Оціни, коли покуриш')},
  repeat(){const e=S.log[sheet.d.i];const E=newEd(e.items.filter(i=>S.shelf.some(s=>s.id===i[0])).map(i=>({id:i[0],p:i[1]})));
    if(E.items.length<e.items.length)toast('Частини тютюну вже немає на полиці');Object.assign(E,{bowl:e.bowl,heat:e.heat,coals:e.coals,pk:e.pk,G:e.g||0});sheet={type:'editor',d:E};edFix();renderSheet()},
  share(){const e=S.log[sheet.d.i],txt='Мій мікс для кальяну:\n'+e.items.map(i=>'• '+tname(tob(i[0]))+' — '+i[1]+'%').join('\n')+'\n'+[e.bowl,e.heat,e.coals+' вугілля'].filter(Boolean).join(', ')+(e.r?'\nОцінка: '+'★'.repeat(e.r):'');
    if(tgOK)TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(txt));else if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Скопійовано'))},
  edel(){ask('Видалити цю забивку?',()=>{S.log.splice(sheet.d.i,1);save();close()})},
  backup(){open('backup')},
  check(d){open('check',d.x?{id:d.x}:{})},
  chk(d){sheet.d={id:d.x,q:sheet.d.q};hap();renderSheet()},
  chkback(){sheet.d={q:sheet.d.q};renderSheet()},
  itmix(d){const m=suggest('me',{must:sheet.d.id,n:3})[+d.x];sheet={type:'editor',d:newEd(m.ids.map((id,i)=>({id,p:m.p[i]})))};edFix();renderSheet()},
  chkbuy(){S.shelf.push({id:sheet.d.id,pack:100,used:0});save();hap('ok');toast('Додано на полицю');renderSheet(1)},
  chkmix(d){const m=verdict(sheet.d.id).mixes[+d.x];sheet={type:'editor',d:newEd(m.ids.map((id,i)=>({id,p:m.p[i]})))};edFix();renderSheet()},
  bcopy(){const t=$('#bk');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Скопійовано'),()=>{try{document.execCommand('copy');toast('Скопійовано')}catch(e){}})},
  bimp(){let d=null;try{d=norm(JSON.parse($('#bk').value))}catch(e){}if(!d)return toast('Це не схоже на копію даних');ask('Замінити поточні дані?',()=>{S=d;save();close();toast('Імпортовано')})},
  reset(){ask('Стерти полицю, щоденник і профіль?',()=>{S=norm({});save();close()})}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset)});
document.addEventListener('input',e=>{const k=e.target.dataset.i;if(!k)return;const v=e.target.value;
  if(k==='q'){q=v;$('#catrows').innerHTML=catRows()}else if(k==='cb')sheet.d.b=v;else if(k==='cn')sheet.d.n=v;else if(k==='note')sheet.d.note=v;else if(k==='chq'){sheet.d.q=v;$('#chkrows').innerHTML=chkRows()}else if(k==='eq'){sheet.d.q=v;$('#eqrows').innerHTML=eqRows()}
  else if(k==='enote'){S.log[sheet.d.i].note=v;save()}});

/* ---------- Старт ---------- */
(async function(){theme();
  if(tgOK){try{TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes();TG.BackButton.onClick(()=>sheet&&close());TG.onEvent('themeChanged',()=>{theme();render();renderSheet(1)})}catch(e){}}
  else matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{theme();render();renderSheet(1)});
  const l=norm(loadLocal());if(l)S=l;render();
  const c=norm(await loadCloud());if(c&&c.ts>S.ts){S=c;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!sheet)render()}else if(cloud&&S.ts&&(!c||c.ts<S.ts))save();
})();
</script>
